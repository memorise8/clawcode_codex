name: Nightly Live Tests

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-anthropic:
    name: Live Anthropic
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ruci'  # only on main repo
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run live Anthropic tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set, skipping"
            exit 0
          fi
          cargo test -p api -- --ignored --test-threads=1

  live-openai:
    name: Live OpenAI
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ruci'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run live OpenAI tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set, skipping"
            exit 0
          fi
          cargo test -p api -- --ignored --test-threads=1
